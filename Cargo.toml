[package]
name = "claude-account-sync"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
dirs = "7.0.0"
log = "0.4.35"
notify = "8.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
thiserror = "2.0.21"
tao = "0.37.2"
tray-icon = "0.26.1"
png = "0.18.1"
time = { version = "0.3.55", features = ["parsing", "formatting", "macros", "local-offset"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
