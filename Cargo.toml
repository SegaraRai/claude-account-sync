[package]
name = "claude-account-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
log = "0.4.34"
notify = "8.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing", "formatting", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
